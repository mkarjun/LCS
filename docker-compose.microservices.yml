# Draft phase-1 microservice topology.
#
# Current repo status:
# - iam / s3 / ec2 nodes are already expressible with per-service enablement flags.
# - the protocol-aware edge is not implemented yet, so the `edge` service below is a target placeholder.
#
# Important EC2 note:
# - do not publish the EC2 SSH range on the ec2 service container.
# - child instance containers bind those host ports directly on the Docker host.

x-node-env: &node-env
  FLOCI_HOSTNAME: edge
  FLOCI_BASE_URL: http://edge:4566
  FLOCI_STORAGE_MODE: wal
  FLOCI_STORAGE_PERSISTENT_PATH: /app/data
  FLOCI_STORAGE_WAL_COMPACTION_INTERVAL_MS: "30000"
  FLOCI_AUTH_VALIDATE_SIGNATURES: "false"
  FLOCI_SERVICES_SSM_ENABLED: "false"
  FLOCI_SERVICES_SQS_ENABLED: "false"
  FLOCI_SERVICES_S3_ENABLED: "false"
  FLOCI_SERVICES_DYNAMODB_ENABLED: "false"
  FLOCI_SERVICES_SNS_ENABLED: "false"
  FLOCI_SERVICES_LAMBDA_ENABLED: "false"
  FLOCI_SERVICES_APIGATEWAY_ENABLED: "false"
  FLOCI_SERVICES_APIGATEWAYV2_ENABLED: "false"
  FLOCI_SERVICES_IAM_ENABLED: "false"
  FLOCI_SERVICES_MSK_ENABLED: "false"
  FLOCI_SERVICES_ELASTICACHE_ENABLED: "false"
  FLOCI_SERVICES_RDS_ENABLED: "false"
  FLOCI_SERVICES_NEPTUNE_ENABLED: "false"
  FLOCI_SERVICES_EVENTBRIDGE_ENABLED: "false"
  FLOCI_SERVICES_SCHEDULER_ENABLED: "false"
  FLOCI_SERVICES_CLOUDWATCHLOGS_ENABLED: "false"
  FLOCI_SERVICES_CLOUDWATCHMETRICS_ENABLED: "false"
  FLOCI_SERVICES_SECRETSMANAGER_ENABLED: "false"
  FLOCI_SERVICES_KINESIS_ENABLED: "false"
  FLOCI_SERVICES_FIREHOSE_ENABLED: "false"
  FLOCI_SERVICES_KMS_ENABLED: "false"
  FLOCI_SERVICES_COGNITO_ENABLED: "false"
  FLOCI_SERVICES_STEPFUNCTIONS_ENABLED: "false"
  FLOCI_SERVICES_CLOUDFORMATION_ENABLED: "false"
  FLOCI_SERVICES_ACM_ENABLED: "false"
  FLOCI_SERVICES_ATHENA_ENABLED: "false"
  FLOCI_SERVICES_GLUE_ENABLED: "false"
  FLOCI_SERVICES_SES_ENABLED: "false"
  FLOCI_SERVICES_OPENSEARCH_ENABLED: "false"
  FLOCI_SERVICES_EC2_ENABLED: "false"
  FLOCI_SERVICES_ECS_ENABLED: "false"
  FLOCI_SERVICES_APPCONFIG_ENABLED: "false"
  FLOCI_SERVICES_APPCONFIGDATA_ENABLED: "false"
  FLOCI_SERVICES_ECR_ENABLED: "false"
  FLOCI_SERVICES_TAGGING_ENABLED: "false"
  FLOCI_SERVICES_BEDROCK_RUNTIME_ENABLED: "false"
  FLOCI_SERVICES_EKS_ENABLED: "false"
  FLOCI_SERVICES_PIPES_ENABLED: "false"
  FLOCI_SERVICES_ELBV2_ENABLED: "false"
  FLOCI_SERVICES_CODEBUILD_ENABLED: "false"
  FLOCI_SERVICES_CODEDEPLOY_ENABLED: "false"
  FLOCI_SERVICES_AUTOSCALING_ENABLED: "false"
  FLOCI_SERVICES_BACKUP_ENABLED: "false"
  FLOCI_SERVICES_ROUTE53_ENABLED: "false"
  FLOCI_SERVICES_TRANSFER_ENABLED: "false"
  FLOCI_SERVICES_TEXTRACT_ENABLED: "false"
  FLOCI_SERVICES_PRICING_ENABLED: "false"
  FLOCI_SERVICES_TRANSCRIBE_ENABLED: "false"
  FLOCI_SERVICES_CE_ENABLED: "false"
  FLOCI_SERVICES_CUR_ENABLED: "false"
  FLOCI_SERVICES_BCM_DATA_EXPORTS_ENABLED: "false"
  FLOCI_SERVICES_CONFIGSERVICE_ENABLED: "false"
  FLOCI_SERVICES_CLOUDFRONT_ENABLED: "false"

x-node-base: &node-base
  build:
    context: .
    dockerfile: docker/Dockerfile
  networks:
    - lcs
  volumes:
    - lcs-shared-data:/app/data

services:
  edge:
    profiles: ["future-edge"]
    image: ghcr.io/lcs/lcs-edge:phase1
    depends_on:
      iam:
        condition: service_healthy
      s3:
        condition: service_healthy
      ec2:
        condition: service_healthy
    ports:
      - "4566:4566"
    environment:
      EDGE_UPSTREAM_IAM: http://iam:4566
      EDGE_UPSTREAM_S3: http://s3:4566
      EDGE_UPSTREAM_EC2: http://ec2:4566
    networks:
      - lcs

  iam:
    <<: *node-base
    environment:
      <<: *node-env
      FLOCI_SERVICES_IAM_ENABLED: "true"

  s3:
    <<: *node-base
    environment:
      <<: *node-env
      FLOCI_SERVICES_S3_ENABLED: "true"

  ec2:
    <<: *node-base
    environment:
      <<: *node-env
      FLOCI_SERVICES_EC2_ENABLED: "true"
      FLOCI_SERVICES_DOCKER_NETWORK: lcs
      FLOCI_SERVICES_EC2_SSH_PORT_RANGE_START: "4300"
      FLOCI_SERVICES_EC2_SSH_PORT_RANGE_END: "4399"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - lcs-shared-data:/app/data

networks:
  lcs:
    name: lcs

volumes:
  lcs-shared-data: